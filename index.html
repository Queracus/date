<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali greš z mano? 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #ffccd5;
      --rose-deep: #ff9aad;
      --rose-dark: #ff6b8b;
      --lavender: #e6e6fa;
      --lavender-deep: #c8c0e0;
      --peach: #ffe6d5;
      --mint: #d6f6e3;
      --cream: #fff8f5;
      --ink: #4a2e3a;
      --shadow: rgba(255, 154, 173, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, var(--rose) 0%, var(--lavender) 50%, var(--mint) 100%);
      background-attachment: fixed;
      color: var(--ink);
      overflow: hidden;
      user-select: none;
    }

    /* Floating hearts background */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 1.4rem;
      color: var(--rose-deep);
      opacity: 0.35;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg) scale(0.6); opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(30deg) scale(1.1); opacity: 0; }
    }

    /* Page container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border: 2.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 36px;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 25px 60px var(--shadow), 0 0 0 1px rgba(255,255,255,0.35) inset;
      animation: popIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    h1 { font-size: 2.6rem; color: var(--rose-dark); margin-bottom: 0.25rem; }
    h2 { font-size: 2rem; color: var(--rose-dark); margin-bottom: 0.25rem; }

    .subtitle {
      font-size: 1.1rem;
      color: var(--ink);
      opacity: 0.7;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 50px;
      padding: 1rem 2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease;
      letter-spacing: 0.01em;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.12); }
    .btn:active { transform: translateY(0) scale(0.97); }

    .btn-yes {
      background: linear-gradient(135deg, var(--rose-deep) 0%, var(--rose-dark) 100%);
      color: white;
    }
    .btn-yes:hover { background: linear-gradient(135deg, var(--rose-dark) 0%, #ff5a80 100%); }

    .btn-no {
      background: linear-gradient(135deg, var(--lavender-deep) 0%, #c8b8e8 100%);
      color: var(--ink);
    }
    .btn-no:hover { background: linear-gradient(135deg, #c8b8e8 0%, #b0a0d0 100%); }

    .btn-opt {
      background: linear-gradient(135deg, var(--rose-deep) 0%, var(--rose-dark) 100%);
      color: white;
      padding: 1.1rem 1.8rem;
      font-size: 1.1rem;
      min-width: 140px;
    }
    .btn-opt:hover { background: linear-gradient(135deg, var(--rose-dark) 0%, #ff5a80 100%); }

    /* Small decorative icon in buttons */
    .btn-emoji { font-size: 1.2rem; margin-right: 0.35rem; vertical-align: middle; }

    /* Date picker section */
    .date-section {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .date-section input[type="date"],
    .date-section input[type="time"] {
      border: 2px solid var(--lavender-deep);
      border-radius: 20px;
      padding: 0.85rem 1rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      background: rgba(255,255,255,0.85);
      color: var(--ink);
      outline: none;
      box-shadow: 0 4px 12px rgba(200,192,224,0.15);
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .date-section input:focus {
      border-color: var(--rose-deep);
      box-shadow: 0 6px 18px rgba(255,154,173,0.2);
    }

    .submit-btn {
      margin-top: 1.5rem;
      background: linear-gradient(135deg, var(--rose-deep) 0%, var(--rose-dark) 100%);
      color: white;
      padding: 1rem 2.8rem;
      font-size: 1.15rem;
      border-radius: 50px;
      border: none;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255,154,173,0.35);
      transition: transform 0.15s ease, box-shadow 0.25s ease;
    }
    .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(255,154,173,0.45); }

    /* Result / saved message */
    .saved-msg {
      margin-top: 1.2rem;
      padding: 1rem 1.2rem;
      background: rgba(214,246,227,0.6);
      border: 1.5px solid var(--mint);
      border-radius: 20px;
      font-weight: 700;
      color: #2a6b3a;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Page transitions */
    .page { display: none; }
    .page.active { display: block; }

    /* Decorative ribbon */
    .ribbon {
      display: inline-block;
      background: linear-gradient(135deg, var(--rose-deep), var(--rose-dark));
      color: white;
      padding: 0.35rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      box-shadow: 0 4px 14px var(--shadow);
      margin-bottom: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 520px) {
      .card { padding: 2.2rem 1.2rem; border-radius: 24px; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.55rem; }
      .btn { padding: 0.85rem 1.4rem; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <main class="container">

    <!-- ===== PAGE 1 ===== -->
    <section class="page active" id="page1" aria-label="Vprašanje za zmenek">
      <div class="card" role="region" aria-live="polite">
        <div class="ribbon">💌 Posebno zate</div>
        <h1>Ali greš z mano na zmenek? 🌸</h1>
        <p class="subtitle">Obljubim, da bo luštno, smešno in malo čarobno.</p>
        <div class="btn-row">
          <button class="btn btn-yes" onclick="goPage2()" aria-label="Da, grem z mano"><span class="btn-emoji">💖</span>Da, seveda!</button>
          <button class="btn btn-no" id="btnNo" aria-label="Ne, hvala">Ne, hvala <span class="btn-emoji">🙏</span></button>
        </div>
      </div>
    </section>

    <!-- ===== PAGE 2 ===== -->
    <section class="page" id="page2" aria-label="Izbira zmenka">
      <div class="card" role="region">
        <div class="ribbon">OMG 😍</div>
        <h2>Ne morem verjeti, da si rekla ja!</h2>
        <p class="subtitle">Kaj ti je najbolj pri srcu? Izberi eno — ali več, če hočeš. 💕</p>
        <div class="btn-row" style="flex-wrap:wrap; gap:0.75rem;">
          <button class="btn btn-opt" onclick="chooseOption('pijača')" aria-label="Pijača">🍹 Pijača</button>
          <button class="btn btn-opt" onclick="chooseOption('sprehod')" aria-label="Sprehod">🌸 Sprehod</button>
          <button class="btn btn-opt" onclick="chooseOption('adrenalin')" aria-label="Adrenalin">⚡ Adrenalin</button>
          <button class="btn btn-opt" onclick="chooseOption('biljard')" aria-label="Biljard">🎱 Biljard</button>
          <button class="btn btn-opt" onclick="chooseOption('večerja')" aria-label="Večerja">🍽️ Večerja</button>
        </div>
      </div>
    </section>

    <!-- ===== PAGE 3 ===== -->
    <section class="page" id="page3" aria-label="Rezervacija datuma">
      <div class="card" role="region">
        <div class="ribbon">📅 Rezerviraj</div>
        <h2>Odlično! Kdaj se dobiva?</h2>
        <p class="subtitle" id="chosenText">Izbrala si: <strong></strong></p>
        <form onsubmit="saveDate(event)" aria-label="Obrazec za rezervacijo zmenka">
          <div class="date-section">
            <input type="date" id="datePick" required aria-label="Izberi datum" />
            <input type="time" id="timePick" required aria-label="Izberi uro" />
          </div>
          <button class="submit-btn" type="submit" aria-label="Shrani zmenek">💌 Shrani zmenek</button>
        </form>
        <div id="savedMsg" class="saved-msg" style="display:none;" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <script>
    // ===== Background floating hearts =====
    (function() {
      const container = document.getElementById('bgHearts');
      const count = 14;
      for (let i = 0; i < count; i++) {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = '💖';
        h.style.left = Math.random() * 100 + '%';
        h.style.animationDuration = (6 + Math.random() * 8) + 's';
        h.style.animationDelay = (Math.random() * 6) + 's';
        h.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
        container.appendChild(h);
      }
    })();

    // ===== Page navigation =====
    function goPage2() {
      document.getElementById('page1').classList.remove('active');
      document.getElementById('page2').classList.add('active');
    }

    let chosenOption = '';
    function chooseOption(opt) {
      const labels = {
        pijača: '🍹 Pijača',
        sprehod: '🌸 Sprehod',
        adrenalin: '⚡ Adrenalin',
        biljard: '🎱 Biljard',
        večerja: '🍽️ Večerja'
      };
      chosenOption = opt;
      document.getElementById('chosenText').querySelector('strong').textContent = labels[opt];
      document.getElementById('page2').classList.remove('active');
      document.getElementById('page3').classList.add('active');
    }

    // ===== Runaway "No" button =====
    // Moves slowly + playfully away when mouse gets close — stays visible, doesn't vanish.
    const btnNo = document.getElementById('btnNo');
    btnNo.style.position = 'fixed';
    btnNo.style.zIndex = '99';
    btnNo.style.transition = 'left 0.55s cubic-bezier(0.34,1.56,0.64,1), top 0.55s cubic-bezier(0.34,1.56,0.64,1), transform 0.35s ease';

    let moveLocked = false;

    function moveNoButton(e) {
      if (moveLocked) return;
      const mx = e.clientX;
      const my = e.clientY;
      const rect = btnNo.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.hypot(mx - cx, my - cy);

      // Trigger when mouse is fairly close — but only occasionally (throttle)
      if (dist < 110) {
        moveLocked = true;
        // Short jump AWAY from mouse (not random screen teleport)
        const angle = Math.atan2(cy - my, cx - mx); // direction away from mouse
        const jumpDist = 160 + Math.random() * 140; // 160-300px — visible nearby
        const newLeft = cx + Math.cos(angle) * jumpDist;
        const newTop = cy + Math.sin(angle) * jumpDist;
        // Clamp so it stays comfortably on screen
        const clampedLeft = Math.max(20, Math.min(window.innerWidth - btnNo.offsetWidth - 20, newLeft));
        const clampedTop = Math.max(20, Math.min(window.innerHeight - btnNo.offsetHeight - 20, newTop));
        btnNo.style.left = clampedLeft + 'px';
        btnNo.style.top = clampedTop + 'px';
        btnNo.style.transform = 'rotate(' + (Math.random() * 16 - 8) + 'deg) scale(1.05)';
        setTimeout(() => { moveLocked = false; }, 700);
      }
    }

    document.addEventListener('mousemove', moveNoButton);

    // ===== Save date & notify =====
    function saveDate(e) {
      e.preventDefault();
      const date = document.getElementById('datePick').value;
      const time = document.getElementById('timePick').value;
      const optionLabels = {
        pijača: 'Pijača', sprehod: 'Sprehod', adrenalin: 'Adrenalin',
        biljard: 'Biljard', večerja: 'Večerja'
      };
      const data = {
        zmenek: optionLabels[chosenOption] || 'Neznan',
        datum: date,
        ura: time,
        cas: new Date().toISOString()
      };
      // Save to localStorage so it survives refresh
      localStorage.setItem('zmenek_izbira', JSON.stringify(data));

      // Show saved message
      const msg = document.getElementById('savedMsg');
      msg.textContent = `Shranila sem: ${data.zmenek} — ${data.datum} ob ${data.ura}. 💕`;
      msg.style.display = 'block';

      // Try to send a notification email via Formspree (free, no backend needed)
      // Replace YOUR_EMAIL below with your real email for notifications to work.
      // Example endpoint: https://formspree.io/f/your-id
      // For a quick notification without setting up anything, below is a placeholder.
      // To activate email notifications, sign up at https://formspree.io and replace endpoint.
      const endpoint = 'https://formspree.io/f/xnqewojk'; // placeholder — replace with your own
      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          subject: '💌 Novi zmenek!',
          message: `Ona je izbrala: ${data.zmenek}\nDatum: ${data.datum}\nUra: ${data.ura}\nČas: ${data.cas}`,
          email: 'zmenek-form@local' // formspree uses this; optional
        })
      }).catch(() => {
        // Silent fail — page still works
      });
    }
  </script>
</body>
</html>
